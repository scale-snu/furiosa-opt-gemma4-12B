[package]
name = "furiosa-opt-gemma4"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.furiosa-opt]

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("npu"))', 'cfg(furiosa_opt)'] }

[lib]
path = "src/lib.rs"

[dependencies]
# scripts/furiosa.sh도 이 버전을 읽어 같은 버전의 컴파일러를 선택한다.
furiosa-opt-std = "=0.6.0"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros"] }
safetensors = "0.4"
memmap2 = "0.9"
llm-tokenizer = "1.4.0"
num-traits = "0.2.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tracing = "0.1.37"

[[test]]
name = "test_kernels"
path = "tests/test_kernels.rs"
harness = false

[profile.release]
debug = false
strip = "symbols"
